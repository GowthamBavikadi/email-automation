name: Bug Report
description: Create a report to help us reproduce and fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What commands or steps led to this issue?
      placeholder: |
        1. Run 'python send.py --resume'
        2. Encounter error '...'
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version & OS
      placeholder: "e.g., Python 3.12 on macOS Sonoma / Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any logs from logs/send.log or terminal output.
      render: shell
